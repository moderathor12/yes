<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — YES Community</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --green: #2d6a4f;
      --lime: #74c69d;
      --bg: #f0f4f0;
      --dark: #1a2e1a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--dark); padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }

    /* Login */
    #login-screen {
      height: 80vh; display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: white; padding: 3rem; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      width: 100%; max-width: 400px; text-align: center;
    }
    .login-box h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; color: var(--green); }
    .login-box p { opacity: 0.55; font-size: 0.9rem; margin-bottom: 1.8rem; }
    input[type="password"], input[type="email"], input[type="text"], textarea {
      width: 100%; padding: 1rem; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 12px; margin-bottom: 1rem;
      font-family: inherit; font-size: 1rem; outline: none; transition: 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(45,106,79,0.1); }
    button {
      width: 100%; padding: 1rem; background: var(--green); color: white; border: none; border-radius: 12px;
      font-weight: 700; cursor: pointer; transition: 0.2s; font-family: inherit; font-size: 1rem;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(45,106,79,0.2); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Dashboard */
    #admin-dashboard { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .header h1 { font-family: 'Space Grotesk', sans-serif; }

    .article-list { display: grid; gap: 1rem; }
    .article-item {
      background: white; padding: 1.5rem; border-radius: 16px; display: flex; gap: 1.5rem; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .article-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; background: #eee; }
    .article-content { flex: 1; }
    .article-content h3 { margin-bottom: 0.5rem; }
    .article-actions { display: flex; gap: 0.5rem; }
    .btn-edit { background: #3498db; }
    .btn-delete { background: #e74c3c; }
    .btn-add { margin-bottom: 1.5rem; background: var(--green); }
    .btn-small { width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; }

    /* Modal */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-content {
      background: white; padding: 2rem; border-radius: 20px; width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-close { float: right; cursor: pointer; font-size: 1.5rem; line-height: 1; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }

    /* Status */
    #login-err { color: #e74c3c; margin-top: 1rem; font-size: 0.9rem; display: none; }
    .empty-state { text-align: center; padding: 3rem; opacity: 0.5; }
    .loading-spinner {
      text-align: center; padding: 3rem; opacity: 0.5; 
    }
  </style>
</head>
<body>

<div class="container" id="login-screen">
  <div class="login-box">
    <h1>YES Admin</h1>
    <p>Supabase ilə daxil ol</p>
    <input type="email" id="admin-email" placeholder="Admin Email">
    <input type="password" id="admin-pass" placeholder="Şifrə">
    <button id="login-btn" onclick="login()">Daxil ol ➔</button>
    <p id="login-err">E-poçt və ya şifrə səhvdir!</p>
  </div>
</div>

<div class="container" id="admin-dashboard">
  <div class="header">
    <h1>Məqalələri İdarə Et</h1>
    <button class="btn-small btn-delete" onclick="logout()" style="width:auto;">Çıxış</button>
  </div>

  <button class="btn-add" onclick="showAddModal()">+ Yeni Məqalə Əlavə Et</button>

  <div id="articles-container" class="article-list">
    <div class="loading-spinner">Yüklənir...</div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal" id="article-modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">×</span>
    <h2 id="modal-title" style="margin-bottom: 1.5rem;">Məqalə Əlavə Et</h2>
    <div class="form-group">
      <label>Başlıq (EN)</label>
      <input type="text" id="art-title-en">
    </div>
    <div class="form-group">
      <label>Başlıq (AZ)</label>
      <input type="text" id="art-title-az">
    </div>
    <div class="form-group">
      <label>Şəkil URL-i</label>
      <input type="text" id="art-image" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Açıqlama (EN)</label>
      <textarea id="art-desc-en" rows="5"></textarea>
    </div>
    <div class="form-group">
      <label>Açıqlama (AZ)</label>
      <textarea id="art-desc-az" rows="5"></textarea>
    </div>
    <input type="hidden" id="art-id">
    <button id="save-btn" onclick="saveArticle()">Yadda Saxla</button>
  </div>
</div>

<script>
  // ── Supabase Config ──────────────────────────────
  const SUPABASE_URL = 'https://wqcugmhjfuvnwxhspytw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxY3VnbWhqZnV2bnd4aHNweXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMzY2NzcsImV4cCI6MjA5MTYxMjY3N30.A2rZNI2hOpDNC_JLeQNO9Is50HswX-jB5he9wNOpYLo';
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // ────────────────────────────────────────────────

  let allArticles = [];

  // ── Auth ────────────────────────────────────────
  async function login() {
    const btn = document.getElementById('login-btn');
    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-pass').value;
    const errEl = document.getElementById('login-err');

    errEl.style.display = 'none';
    btn.disabled = true;
    btn.innerText = 'Giriş edilir...';

    const { error } = await sbClient.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.innerText = 'Daxil ol ➔';
      return;
    }

    showDashboard();
  }

  async function logout() {
    await sbClient.auth.signOut();
    location.reload();
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-dashboard').style.display = 'block';
    loadArticles();
  }

  // Check existing session on page load
  window.addEventListener('load', async () => {
    const { data: { session } } = await sbClient.auth.getSession();
    if (session) showDashboard();
  });
  // ────────────────────────────────────────────────

  // ── Articles CRUD ────────────────────────────────
  async function loadArticles() {
    const container = document.getElementById('articles-container');
    container.innerHTML = '<div class="loading-spinner">Yüklənir...</div>';

    const { data, error } = await sbClient
      .from('articles')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      container.innerHTML = '<div class="empty-state">Xəta: ' + error.message + '</div>';
      return;
    }

    allArticles = data || [];
    renderArticles();
  }

  function renderArticles() {
    const container = document.getElementById('articles-container');
    container.innerHTML = '';

    if (allArticles.length === 0) {
      container.innerHTML = '<div class="empty-state">Hələ heç bir məqalə yoxdur. Yeni əlavə edin.</div>';
      return;
    }

    allArticles.forEach((art, index) => {
      const div = document.createElement('div');
      div.className = 'article-item';
      div.innerHTML = `
        <img src="${art.image || ''}" alt="" onerror="this.style.background='#eee';this.removeAttribute('src')">
        <div class="article-content">
          <h3>${art.title_en || '(başlıq yoxdur)'}</h3>
          <p style="font-size:0.85rem; opacity:0.7;">${art.title_az || ''}</p>
        </div>
        <div class="article-actions">
          <button class="btn-small btn-edit" onclick="showEditModal(${index})">Düzəlt</button>
          <button class="btn-small btn-delete" onclick="deleteArticle('${art.id}')">Sil</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function showAddModal() {
    document.getElementById('modal-title').innerText = 'Yeni Məqalə Əlavə Et';
    document.getElementById('art-id').value = '';
    document.getElementById('art-title-en').value = '';
    document.getElementById('art-title-az').value = '';
    document.getElementById('art-image').value = '';
    document.getElementById('art-desc-en').value = '';
    document.getElementById('art-desc-az').value = '';
    document.getElementById('article-modal').style.display = 'flex';
  }

  function showEditModal(index) {
    const art = allArticles[index];
    document.getElementById('modal-title').innerText = 'Məqaləni Düzəlt';
    document.getElementById('art-id').value = art.id;
    document.getElementById('art-title-en').value = art.title_en || '';
    document.getElementById('art-title-az').value = art.title_az || '';
    document.getElementById('art-image').value = art.image || '';
    document.getElementById('art-desc-en').value = art.desc_en || '';
    document.getElementById('art-desc-az').value = art.desc_az || '';
    document.getElementById('article-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('article-modal').style.display = 'none';
  }

  async function saveArticle() {
    const btn = document.getElementById('save-btn');
    const id = document.getElementById('art-id').value;
    const article = {
      title_en: document.getElementById('art-title-en').value,
      title_az: document.getElementById('art-title-az').value,
      image:    document.getElementById('art-image').value,
      desc_en:  document.getElementById('art-desc-en').value,
      desc_az:  document.getElementById('art-desc-az').value,
    };

    btn.disabled = true;
    btn.innerText = 'Saxlanılır...';

    let error;
    if (id) {
      // Update
      ({ error } = await sbClient.from('articles').update(article).eq('id', id));
    } else {
      // Insert
      ({ error } = await sbClient.from('articles').insert(article));
    }

    if (error) {
      alert('Xəta: ' + error.message);
    } else {
      closeModal();
      loadArticles();
    }

    btn.disabled = false;
    btn.innerText = 'Yadda Saxla';
  }

  async function deleteArticle(id) {
    if (!confirm('Bu məqaləni silmək istədiyindən əminsən?')) return;

    const { error } = await sbClient.from('articles').delete().eq('id', id);
    if (error) {
      alert('Xəta: ' + error.message);
    } else {
      loadArticles();
    }
  }
  // ────────────────────────────────────────────────
</script>

</body>
</html>
