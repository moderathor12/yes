<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — YES Community</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #2d6a4f;
      --lime: #74c69d;
      --bg: #f0f4f0;
      --dark: #1a2e1a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--dark); padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Login */
    #login-screen {
      height: 80vh; display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: white; padding: 3rem; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      width: 100%; max-width: 400px; text-align: center;
    }
    .login-box h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 1.5rem; color: var(--green); }
    input[type="password"], input[type="text"], textarea {
      width: 100%; padding: 1rem; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 12px; margin-bottom: 1rem;
      font-family: inherit; font-size: 1rem; outline: none; transition: 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(45,106,79,0.1); }
    button {
      width: 100%; padding: 1rem; background: var(--green); color: white; border: none; border-radius: 12px;
      font-weight: 700; cursor: pointer; transition: 0.2s; font-family: inherit;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(45,106,79,0.2); }
    
    /* Dashboard */
    #admin-dashboard { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .header h1 { font-family: 'Space Grotesk', sans-serif; }
    
    .article-list { display: grid; gap: 1rem; }
    .article-item {
      background: white; padding: 1.5rem; border-radius: 16px; display: flex; gap: 1.5rem; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .article-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; }
    .article-content { flex: 1; }
    .article-content h3 { margin-bottom: 0.5rem; }
    .article-actions { display: flex; gap: 0.5rem; }
    .btn-edit { background: #3498db; }
    .btn-delete { background: #e74c3c; }
    .btn-add { margin-bottom: 1.5rem; background: var(--green); }
    .btn-small { width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; }

    /* Modal */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-content {
      background: white; padding: 2rem; border-radius: 20px; width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-close { float: right; cursor: pointer; font-size: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container" id="login-screen">
  <div class="login-box">
    <h1>YES Admin</h1>
    <input type="password" id="admin-pass" placeholder="Enter Password">
    <button onclick="login()">Login ➔</button>
    <p id="login-err" style="color:red; margin-top:1rem; font-size:0.9rem; display:none;">Invalid password!</p>
  </div>
</div>

<div class="container" id="admin-dashboard">
  <div class="header">
    <h1>Manage Articles</h1>
    <button class="btn-small btn-delete" onclick="logout()" style="width:auto;">Logout</button>
  </div>
  
  <button class="btn-add" onclick="showAddModal()">+ Add New Article</button>
  
  <div id="articles-container" class="article-list">
    <!-- Articles will be loaded here -->
    <p>Loading articles...</p>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal" id="article-modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">×</span>
    <h2 id="modal-title" style="margin-bottom: 1.5rem;">Add Article</h2>
    <div class="form-group">
      <label>Title (EN)</label>
      <input type="text" id="art-title-en">
    </div>
    <div class="form-group">
      <label>Title (AZ)</label>
      <input type="text" id="art-title-az">
    </div>
    <div class="form-group">
      <label>Image URL (Hosted link preferred)</label>
      <input type="text" id="art-image">
    </div>
    <div class="form-group">
      <label>Description (EN)</label>
      <textarea id="art-desc-en" rows="5"></textarea>
    </div>
    <div class="form-group">
      <label>Description (AZ)</label>
      <textarea id="art-desc-az" rows="5"></textarea>
    </div>
    <input type="hidden" id="art-id">
    <button id="save-btn" onclick="saveArticle()">Save Article</button>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyddf_y2oZn-iH99ekj5V0Y5SQhSbn6BE8KNPLjIOwv736tOboxr1pGX4F89HOgUrNqUA/exec';
  let adminPass = '';
  let allArticles = [];

  function login() {
    const input = document.getElementById('admin-pass');
    adminPass = input.value;
    loadArticles();
  }

  function logout() {
    location.reload();
  }

  async function loadArticles() {
    const container = document.getElementById('articles-container');
    container.innerHTML = '<p>Verifying password & loading...</p>';
    
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getEvents' })
      });
      const result = await response.json();
      
      if (result.result === 'success') {
        allArticles = result.data;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'block';
        renderArticles();
      } else {
        document.getElementById('login-err').style.display = 'block';
      }
    } catch (err) {
      alert('Error connecting to Server');
    }
  }

  function renderArticles() {
    const container = document.getElementById('articles-container');
    container.innerHTML = '';
    
    allArticles.forEach((art, index) => {
      const div = document.createElement('div');
      div.className = 'article-item';
      div.innerHTML = `
        <img src="${art.image || 'https://via.placeholder.com/100'}" alt="">
        <div class="article-content">
          <h3>${art.title_en}</h3>
          <p style="font-size:0.85rem; opacity:0.7;">${art.title_az}</p>
        </div>
        <div class="article-actions">
          <button class="btn-small btn-edit" onclick="showEditModal(${index})">Edit</button>
          <button class="btn-small btn-delete" onclick="deleteArticle('${art.id}')">Delete</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function showAddModal() {
    document.getElementById('modal-title').innerText = 'Add New Article';
    document.getElementById('art-id').value = '';
    document.getElementById('art-title-en').value = '';
    document.getElementById('art-title-az').value = '';
    document.getElementById('art-image').value = '';
    document.getElementById('art-desc-en').value = '';
    document.getElementById('art-desc-az').value = '';
    document.getElementById('article-modal').style.display = 'flex';
  }

  function showEditModal(index) {
    const art = allArticles[index];
    document.getElementById('modal-title').innerText = 'Edit Article';
    document.getElementById('art-id').value = art.id;
    document.getElementById('art-title-en').value = art.title_en;
    document.getElementById('art-title-az').value = art.title_az;
    document.getElementById('art-image').value = art.image;
    document.getElementById('art-desc-en').value = art.desc_en;
    document.getElementById('art-desc-az').value = art.desc_az;
    document.getElementById('article-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('article-modal').style.display = 'none';
  }

  async function saveArticle() {
    const btn = document.getElementById('save-btn');
    const id = document.getElementById('art-id').value;
    const article = {
      id: id,
      title_en: document.getElementById('art-title-en').value,
      title_az: document.getElementById('art-title-az').value,
      image: document.getElementById('art-image').value,
      desc_en: document.getElementById('art-desc-en').value,
      desc_az: document.getElementById('art-desc-az').value
    };

    btn.disabled = true;
    btn.innerText = 'Saving...';

    const action = id ? 'updateEvent' : 'addEvent';
    
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: action, 
          password: adminPass,
          event: article,
          id: id 
        })
      });
      const result = await response.json();
      if (result.result === 'success') {
        alert('Saved successfully!');
        closeModal();
        loadArticles();
      } else {
        alert('Error: ' + result.message);
      }
    } catch (err) { alert('Network Error'); }
    btn.disabled = false;
    btn.innerText = 'Save Article';
  }

  async function deleteArticle(id) {
    if (!confirm('Are you sure you want to delete this article?')) return;
    
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'deleteEvent', 
          password: adminPass,
          id: id 
        })
      });
      const result = await response.json();
      if (result.result === 'success') {
        loadArticles();
      } else {
        alert('Error: ' + result.message);
      }
    } catch (err) { alert('Network Error'); }
  }
</script>

</body>
</html>
