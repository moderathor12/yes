<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Youth Environment Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="shortcut icon" href="favicon/favicon.ico">
  <style>
    :root {
      --green: #2d6a4f;
      --lime: #74c69d;
      --bright: #b7e4c7;
      --dark: #1a2e1a;
      --bg: #f0f4f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: radial-gradient(ellipse at 70% 40%, #d8f3dc 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, #b7e4c7 0%, transparent 50%),
                  var(--bg);
    }

    .reset-card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.12);
      text-align: center;
      animation: cardIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .reset-card .logo {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin-bottom: 2rem; text-decoration: none;
    }
    .logo-badge {
      background: var(--green); color: white; padding: 0.3rem 0.6rem;
      border-radius: 6px; font-size: 1rem; letter-spacing: 1px;
      font-family: 'Space Grotesk', sans-serif; font-weight: 800;
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif; font-weight: 800;
      font-size: 1.1rem; color: var(--green);
    }

    .reset-card h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem; font-weight: 700;
      color: var(--dark); margin-bottom: 0.5rem;
    }
    .reset-card .subtitle {
      font-size: 0.88rem; color: rgba(0,0,0,0.5);
      margin-bottom: 1.5rem;
    }

    .reset-card .input-group {
      text-align: left; margin-bottom: 1rem;
    }
    .reset-card label {
      font-size: 0.88rem; font-weight: 600; color: rgba(0,0,0,0.8);
      display: block; margin-bottom: 0.3rem;
    }
    .reset-card input {
      width: 100%; padding: 0.7rem 0.75rem;
      border: 1.5px solid rgba(0,0,0,0.12); border-radius: 10px;
      font-size: 0.95rem; font-family: inherit; color: var(--dark);
      outline: none; transition: all 0.25s ease;
    }
    .reset-card input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(45,106,79,0.12);
    }

    .reset-card .submit-btn {
      width: 100%; padding: 0.7rem 1rem; margin-top: 0.5rem;
      background: var(--green); color: white; border: none;
      border-radius: 10px; font-size: 0.95rem; font-weight: 700;
      font-family: 'Space Grotesk', sans-serif; cursor: pointer;
      transition: all 0.2s;
    }
    .reset-card .submit-btn:hover { background: var(--dark); }
    .reset-card .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .reset-card .message {
      margin-top: 1rem; font-size: 0.85rem;
      display: none; padding: 0.8rem; border-radius: 10px;
    }
    .reset-card .message.error { display: block; background: #fef2f2; color: #e74c3c; border: 1px solid #fecaca; }
    .reset-card .message.success { display: block; background: #f0fdf4; color: var(--green); border: 1px solid var(--bright); }

    .reset-card .back-link {
      display: inline-block; margin-top: 1.5rem;
      color: var(--green); font-weight: 600; font-size: 0.88rem;
      text-decoration: none; transition: color 0.2s;
    }
    .reset-card .back-link:hover { color: var(--dark); }

    /* Monkey avatar mini */
    .monkey-mini {
      width: 80px; height: 80px; margin: 0 auto 1rem;
      background: var(--bright); border: 2px solid var(--green);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .monkey-mini svg { width: 68px; height: 68px; }
  </style>
</head>
<body>

  <div class="reset-card">
    <a href="index.html" class="logo">
      <span class="logo-badge">YES</span>
      <span class="logo-text">Youth Environment Society</span>
    </a>

    <div class="monkey-mini">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <ellipse cx="53.7" cy="33" rx="8.3" ry="8.2" fill="#89664c"/>
        <ellipse cx="53.7" cy="33" rx="5.4" ry="5.4" fill="#ffc5d3"/>
        <ellipse cx="10.2" cy="33" rx="8.2" ry="8.2" fill="#89664c"/>
        <ellipse cx="10.2" cy="33" rx="5.4" ry="5.4" fill="#ffc5d3"/>
        <g fill="#89664c">
          <path d="m43.4 10.8c1.1-.6 1.9-.9 1.9-.9-3.2-1.1-6-1.8-8.5-2.1 1.3-1 2.1-1.3 2.1-1.3-20.4-2.9-30.1 9-30.1 19.5h46.4c-.7-7.4-4.8-12.4-11.8-15.2"/>
          <path d="m55.3 27.6c0-9.7-10.4-17.6-23.3-17.6s-23.3 7.9-23.3 17.6c0 2.3.6 4.4 1.6 6.4-1 2-1.6 4.2-1.6 6.4 0 9.7 10.4 17.6 23.3 17.6s23.3-7.9 23.3-17.6c0-2.3-.6-4.4-1.6-6.4 1-2 1.6-4.2 1.6-6.4"/>
        </g>
        <path d="m52 28.2c0-16.9-20-6.1-20-6.1s-20-10.8-20 6.1c0 4.7 2.9 9 7.5 11.7-1.3 1.7-2.1 3.6-2.1 5.7 0 6.1 6.6 11 14.7 11s14.7-4.9 14.7-11c0-2.1-.8-4-2.1-5.7 4.4-2.7 7.3-7 7.3-11.7" fill="#e0ac7e"/>
        <g fill="#3b302a">
          <path d="m35.1 38.7c0 1.1-.4 2.1-1 2.1-.6 0-1-.9-1-2.1 0-1.1.4-2.1 1-2.1.6.1 1 1 1 2.1"/>
          <path d="m30.9 38.7c0 1.1-.4 2.1-1 2.1-.6 0-1-.9-1-2.1 0-1.1.4-2.1 1-2.1.5.1 1 1 1 2.1"/>
          <ellipse cx="40.7" cy="31.7" rx="3.5" ry="4.5"/>
          <ellipse cx="23.3" cy="31.7" rx="3.5" ry="4.5"/>
        </g>
      </svg>
    </div>

    <h1 id="reset-title">Set New Password</h1>
    <p class="subtitle" id="reset-sub">Enter your new password below.</p>

    <div class="input-group">
      <label for="new-pass">New Password</label>
      <input type="password" id="new-pass" placeholder="Enter new password" minlength="6" />
    </div>

    <div class="input-group">
      <label for="confirm-pass">Confirm Password</label>
      <input type="password" id="confirm-pass" placeholder="Confirm new password" />
    </div>

    <button class="submit-btn" id="reset-btn" onclick="resetPassword()">Update Password</button>

    <div class="message" id="reset-message"></div>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wqcugmhjfuvnwxhspytw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxY3VnbWhqZnV2bnd4aHNweXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMzY2NzcsImV4cCI6MjA5MTYxMjY3N30.A2rZNI2hOpDNC_JLeQNO9Is50HswX-jB5he9wNOpYLo';
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Detect language
    const lang = localStorage.getItem('yes_lang') || 'en';
    const isAz = lang === 'az';

    // Localize
    if (isAz) {
      document.getElementById('reset-title').innerText = 'Yeni Şifrə Təyin Et';
      document.getElementById('reset-sub').innerText = 'Aşağıda yeni şifrənizi daxil edin.';
      document.querySelector('label[for="new-pass"]').innerText = 'Yeni Şifrə';
      document.querySelector('label[for="confirm-pass"]').innerText = 'Şifrəni Təsdiqlə';
      document.getElementById('new-pass').placeholder = 'Yeni şifrəni daxil edin';
      document.getElementById('confirm-pass').placeholder = 'Yeni şifrəni təsdiqləyin';
      document.getElementById('reset-btn').innerText = 'Şifrəni Yenilə';
      document.querySelector('.back-link').innerText = '← Ana Səhifəyə Qayıt';
    }

    async function resetPassword() {
      const newPass = document.getElementById('new-pass').value;
      const confirmPass = document.getElementById('confirm-pass').value;
      const msg = document.getElementById('reset-message');
      const btn = document.getElementById('reset-btn');

      msg.className = 'message';
      msg.style.display = 'none';

      if (!newPass || newPass.length < 6) {
        msg.className = 'message error';
        msg.innerText = isAz ? 'Şifrə ən azı 6 simvol olmalıdır.' : 'Password must be at least 6 characters.';
        return;
      }

      if (newPass !== confirmPass) {
        msg.className = 'message error';
        msg.innerText = isAz ? 'Şifrələr uyğun gəlmir.' : 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      btn.innerText = isAz ? 'Gözləyin...' : 'Please wait...';

      const { error } = await sbClient.auth.updateUser({ password: newPass });

      if (error) {
        msg.className = 'message error';
        msg.innerText = error.message;
        btn.disabled = false;
        btn.innerText = isAz ? 'Şifrəni Yenilə' : 'Update Password';
        return;
      }

      msg.className = 'message success';
      msg.innerText = isAz
        ? 'Şifrəniz uğurla yeniləndi! Ana səhifəyə yönləndirilirsiniz...'
        : 'Password updated successfully! Redirecting to homepage...';
      btn.style.display = 'none';

      setTimeout(() => { window.location.href = 'index.html'; }, 2500);
    }
  </script>
</body>
</html>
