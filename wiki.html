<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki — Youth Environment Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  
  <style>
    :root {
      /* YES Brand Colors */
      --green: #2d6a4f;
      --lime: #74c69d;
      --bright: #b7e4c7;
      --yellow: #f4d35e;
      --pink: #e07a5f;
      --purple: #9b72cf;
      --dark: #1a2e1a;
      
      /* Wiki App Colors */
      --app-bg: #f4f7f4;
      --sidebar-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(45, 106, 79, 0.1);
      --text-main: #2a3f2a;
      --text-muted: #5a7a5a;
      --accent-bg: rgba(116, 198, 157, 0.15);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--text-main);
    }

    /* ── HEADER ── */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 20px;
      z-index: 100;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--green);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      text-decoration: none;
      width: 240px; /* match sidebar width */
    }

    .logo-badge {
      background: var(--green);
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .search-wrap {
      flex: 1;
      max-width: 480px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--lime);
      box-shadow: 0 0 0 3px rgba(116, 198, 157, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .header-right {
      display: flex; gap: 12px; align-items: center; margin-left: auto;
    }

    .btn-icon {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--accent-bg);
      color: var(--green);
      border-color: var(--lime);
    }

    .lang-btn {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      background: var(--accent-bg);
      color: var(--green);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .lang-btn:hover {
      background: rgba(116, 198, 157, 0.3);
    }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    aside {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
      padding: 16px 12px;
    }

    .nav-section {
      margin-bottom: 8px;
    }

    .nav-item-toggle {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      gap: 10px;
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
    }

    .nav-item-toggle i {
      font-size: 1.2rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .nav-item-toggle:hover {
      background: var(--app-bg);
    }

    .nav-item-toggle.active-main {
      background: var(--accent-bg);
      color: var(--green);
    }
    .nav-item-toggle.active-main i {
      color: var(--green);
    }

    .nav-arrow {
      margin-left: auto;
      font-size: 0.8rem;
      transition: transform 0.2s;
      color: var(--text-muted);
    }

    .nav-item-toggle.open .nav-arrow {
      transform: rotate(90deg);
    }

    .sub-nav {
      display: none;
      flex-direction: column;
      padding-left: 36px;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .sub-nav.open { display: flex; }

    .sub-nav a {
      padding: 8px 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 2px;
      transition: all 0.2s;
      border-left: 2px solid transparent;
    }

    .sub-nav a:hover {
      color: var(--green);
      background: var(--app-bg);
    }

    .sub-nav a.active {
      color: var(--green);
      background: var(--accent-bg);
      font-weight: 600;
    }

    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 12px;
    }

    .back-link {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.2s;
      margin-top: auto;
    }

    .back-link:hover {
      background: var(--app-bg);
      color: var(--dark);
    }

    /* ── MAIN CONTENT ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      scroll-behavior: smooth;
    }

    .content-wrap {
      padding: 40px 5%;
      max-width: 900px;
      margin: 0 auto;
    }

    .breadcrumb {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .breadcrumb span { margin: 0 6px; opacity: 0.5; }

    .page-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 30px;
      line-height: 1.1;
    }

    /* Hero Banner for Home */
    .org-hero {
      background: linear-gradient(135deg, #2d6a4f 0%, #1a2e1a 100%);
      border-radius: 20px;
      padding: 40px;
      color: white;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 30px;
      box-shadow: 0 15px 40px rgba(45, 106, 79, 0.2);
      position: relative;
      overflow: hidden;
    }

    .org-hero::after {
      content: '';
      position: absolute;
      top: -50%; right: -10%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(116, 198, 157, 0.3) 0%, transparent 70%);
      pointer-events: none;
    }

    .org-hero-icon {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }

    .org-hero h2 { 
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem; 
      margin-bottom: 10px; 
    }
    
    .org-hero p { 
      opacity: 0.9; 
      font-size: 1.05rem; 
      line-height: 1.6; 
    }

    /* Cards Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .nav-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .nav-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(45, 106, 79, 0.08);
      border-color: var(--lime);
    }

    .nav-card-icon { 
      font-size: 32px; 
      margin-bottom: 16px; 
      color: var(--green);
    }
    .nav-card h3 { 
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem; 
      font-weight: 700; 
      margin-bottom: 8px; 
      color: var(--dark); 
    }
    .nav-card p { 
      font-size: 0.9rem; 
      color: var(--text-muted); 
      line-height: 1.6; 
    }

    /* Content Typography */
    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark);
      margin: 40px 0 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .body-text {
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .wiki-list {
      margin: 0 0 24px 0;
      padding-left: 0;
      list-style: none;
    }

    .wiki-list li {
      font-size: 1.05rem;
      color: var(--text-main);
      line-height: 1.7;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    
    .wiki-list li::before {
      content: '•';
      color: var(--lime);
      font-weight: bold;
      font-size: 1.2rem;
    }

    .wiki-list li a { 
      color: var(--green); 
      text-decoration: none; 
      font-weight: 600;
    }
    .wiki-list li a:hover { text-decoration: underline; }

    /* Callouts */
    .callout {
      background: var(--accent-bg);
      border-left: 4px solid var(--green);
      padding: 20px 24px;
      border-radius: 0 12px 12px 0;
      margin: 24px 0;
      font-size: 1rem;
      color: var(--dark);
      line-height: 1.7;
    }
    .callout strong { font-weight: 700; color: var(--green); }

    /* Tags */
    .tag {
      display: inline-block;
      background: white;
      border: 1px solid var(--border);
      color: var(--green);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-right: 10px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .tag.done { background: rgba(116, 198, 157, 0.2); border-color: var(--lime); }
    .tag.ongoing { background: rgba(244, 211, 94, 0.2); border-color: var(--yellow); color: #9c7f1a; }
    .tag.planned { background: rgba(224, 122, 95, 0.1); border-color: var(--pink); color: var(--pink); }

    /* Team Grid */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin: 24px 0;
    }

    .member-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 16px;
      background: white;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .member-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--lime);
    }

    .member-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--lime), var(--green));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: white; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
      margin: 0 auto 16px;
    }

    .member-name { font-size: 1.05rem; font-weight: 700; color: var(--dark); font-family: 'Space Grotesk', sans-serif; }
    .member-role { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

    /* Pages */
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile Menu Toggle */
    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--dark);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .mobile-toggle { display: block; }
      
      /* Sidebar slides in from left */
      aside {
        position: fixed;
        left: -100%;
        top: 60px;
        height: calc(100vh - 60px);
        width: 80%;
        max-width: 300px;
        z-index: 99;
        transition: left 0.3s ease;
        box-shadow: 5px 0 20px rgba(0,0,0,0.1);
        overflow-y: auto;
      }
      aside.open { left: 0; }

      /* Overlay when sidebar is open */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        top: 60px;
        background: rgba(0,0,0,0.35);
        z-index: 98;
      }
      .sidebar-overlay.active { display: block; }

      /* Header */
      header {
        padding: 0 14px;
        gap: 10px;
      }
      .logo { font-size: 1rem; width: auto; }
      .logo-badge { font-size: 0.8rem; padding: 0.15rem 0.4rem; }
      .search-wrap { display: none; }
      .header-right { gap: 8px; }
      .lang-btn { font-size: 0.8rem; padding: 5px 10px; }
      .btn-icon { width: 34px; height: 34px; font-size: 1.1rem; }

      /* Layout */
      .layout { overflow: visible; }
      main { overflow-y: visible; }

      /* Content */
      .content-wrap { padding: 20px 16px 40px; }
      .page-title { font-size: 1.7rem; line-height: 1.2; margin-bottom: 20px; }
      .breadcrumb { font-size: 0.78rem; margin-bottom: 14px; }
      .body-text { font-size: 1rem; line-height: 1.75; }
      .section-title { font-size: 1.25rem; margin: 28px 0 12px; }

      /* Hero card */
      .org-hero { flex-direction: column; text-align: center; gap: 14px; padding: 24px 16px; border-radius: 14px; }
      .org-hero-icon { width: 60px; height: 60px; font-size: 28px; border-radius: 14px; }
      .org-hero h2 { font-size: 1.35rem; }
      .org-hero p { font-size: 0.95rem; }

      /* Nav cards grid — 2 columns on phone */
      .card-grid { grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
      .nav-card { padding: 16px 14px; border-radius: 12px; }
      .nav-card-icon { font-size: 24px; margin-bottom: 10px; }
      .nav-card h3 { font-size: 0.95rem; }
      .nav-card p { font-size: 0.82rem; }

      /* Team grid — 2 columns */
      .team-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .member-card { padding: 18px 12px; border-radius: 12px; }
      .member-avatar { width: 52px; height: 52px; font-size: 18px; margin-bottom: 10px; }
      .member-name { font-size: 0.9rem; }
      .member-role { font-size: 0.8rem; }

      /* Callout */
      .callout { padding: 14px 16px; font-size: 0.92rem; }

      /* Lists */
      .wiki-list li { font-size: 0.95rem; }

      /* Tags */
      .tag { font-size: 0.75rem; padding: 3px 8px; }

      /* Sidebar nav items larger touch targets */
      .nav-item-toggle { padding: 13px 12px; font-size: 1rem; }
      .sub-nav a { padding: 10px 12px; font-size: 0.92rem; }
    }

    /* Extra small phones */
    @media (max-width: 380px) {
      .card-grid { grid-template-columns: 1fr; }
      .team-grid { grid-template-columns: 1fr; }
      .page-title { font-size: 1.5rem; }
    }
    
    mark {
      background: var(--yellow);
      color: var(--dark);
      padding: 0 2px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <button class="mobile-toggle" onclick="toggleSidebar()"><i class="ph ph-list"></i></button>
  <a class="logo" href="index.html">
    <span class="logo-badge">YES</span>
    Wiki
  </a>
  
  <div class="search-wrap">
    <i class="ph ph-magnifying-glass search-icon"></i>
    <input type="text" id="searchInput" data-i18n-ph="search_ph" placeholder="Axtar..." oninput="handleSearch(this.value)">
  </div>
  
  <div class="header-right">
    <button class="lang-btn" onclick="toggleLang()" id="lang-toggle">EN</button>
    <a href="index.html" class="btn-icon" title="Go to Website"><i class="ph ph-globe"></i></a>
  </div>
</header>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<div class="layout">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="nav-section">
      <button class="nav-item-toggle active-main" onclick="showPage('home')" id="btn-home">
        <i class="ph ph-house"></i>
        <span data-i18n="nav_home">Ana Səhifə</span>
      </button>
    </div>

    <div class="nav-section">
      <button class="nav-item-toggle" onclick="toggleSub(this, 'nav-about')">
        <i class="ph ph-info"></i>
        <span data-i18n="nav_about">Haqqımızda</span>
        <i class="ph ph-caret-right nav-arrow"></i>
      </button>
      <div class="sub-nav" id="nav-about">
        <a href="#" onclick="showPage('about', 'mission')" data-i18n="nav_about_mission">Missiya & Vizyon</a>
        <a href="#" onclick="showPage('about', 'history')" data-i18n="nav_about_history">Tarixçə</a>
        <a href="#" onclick="showPage('about', 'values')" data-i18n="nav_about_values">Dəyərlərimiz</a>
      </div>
    </div>

    <div class="nav-section">
      <button class="nav-item-toggle" onclick="showPage('team')" id="btn-team">
        <i class="ph ph-users"></i>
        <span data-i18n="nav_team">Komanda</span>
      </button>
    </div>

    <div class="nav-section">
      <button class="nav-item-toggle" onclick="toggleSub(this, 'nav-projects')">
        <i class="ph ph-folder-open"></i>
        <span data-i18n="nav_projects">Fəaliyyətimiz</span>
        <i class="ph ph-caret-right nav-arrow"></i>
      </button>
      <div class="sub-nav" id="nav-projects">
        <a href="#" onclick="showPage('projects', 'active')" data-i18n="nav_proj_active">Aktiv Layihələr</a>
        <a href="#" onclick="showPage('projects', 'completed')" data-i18n="nav_proj_done">Uğurlarımız</a>
      </div>
    </div>

    <div class="nav-section">
      <button class="nav-item-toggle" onclick="toggleSub(this, 'nav-docs')">
        <i class="ph ph-scroll"></i>
        <span data-i18n="nav_docs">Sənədlər</span>
        <i class="ph ph-caret-right nav-arrow"></i>
      </button>
      <div class="sub-nav" id="nav-docs">
        <a href="#" onclick="showPage('docs', 'reports')" data-i18n="nav_docs_reports">İllik Hesabatlar</a>
        <a href="#" onclick="showPage('docs', 'charter')" data-i18n="nav_docs_charter">Nizamnamə</a>
      </div>
    </div>

    <div class="nav-section">
      <button class="nav-item-toggle" onclick="showPage('contact')" id="btn-contact">
        <i class="ph ph-address-book"></i>
        <span data-i18n="nav_contact">Əlaqə & Dəstək</span>
      </button>
    </div>

    <hr class="sidebar-divider"/>

    <a class="back-link" href="index.html">
      <i class="ph ph-arrow-left"></i> <span data-i18n="nav_back">Əsas Səhifəyə Qayıt</span>
    </a>
  </aside>

  <!-- MAIN -->
  <main id="main-content">
    <!-- Dynamic Content Rendered Here -->
  </main>
</div>

<script>
  // Content Data (Bilingual)
  const wikiData = {
    en: {
      search_ph: "Search...",
      nav_home: "Home",
      nav_about: "About Us",
      nav_about_mission: "Mission & Vision",
      nav_about_history: "History",
      nav_about_values: "Our Values",
      nav_team: "Team",
      nav_projects: "Our Work",
      nav_proj_active: "Active Projects",
      nav_proj_done: "Our Successes",
      nav_docs: "Documents",
      nav_docs_reports: "Annual Reports",
      nav_docs_charter: "Charter",
      nav_contact: "Contact & Support",
      nav_back: "Back to Main Site",

      pages: {
        home: `
          <div class="breadcrumb">Wiki <span>›</span> Home</div>
          <h1 class="page-title">Welcome to YES Wiki</h1>
          <div class="org-hero">
            <div class="org-hero-icon"><i class="ph ph-leaf"></i></div>
            <div>
              <h2>Public Knowledge Base</h2>
              <p>Everything you need to know about Youth Environment Society (YES). Learn about our mission, our impact on nature, and how you can be a part of the change.</p>
            </div>
          </div>
          <p class="body-text">Welcome to the official public directory for YES. Explore our structure, read our public reports, or learn more about our ongoing initiatives.</p>

  let currentLang = localStorage.getItem('yes_lang') || 'az';

  function toggleSub(btn, id) {
    const sub = document.getElementById(id);
    const isOpen = sub.classList.contains('open');
    
    // Close others
    document.querySelectorAll('.sub-nav').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.nav-item-toggle').forEach(el => el.classList.remove('open'));
    
    if (!isOpen) {
      sub.classList.add('open');
      btn.classList.add('open');
    }
  }

  function showPage(pageId, hashId = null) {
    // Render content
    const mainContent = document.getElementById('main-content');
    mainContent.innerHTML = '<div class="content-wrap page active">' + wikiData[currentLang].pages[pageId] + '</div>';

    // Update active nav main buttons
    document.querySelectorAll('.nav-item-toggle').forEach(btn => btn.classList.remove('active-main'));
    if (pageId === 'home' || pageId === 'contact' || pageId === 'team') {
      const btn = document.getElementById('btn-' + pageId);
      if(btn) btn.classList.add('active-main');
    } else {
      // Find the parent nav toggle and set active
      const subNav = document.getElementById('nav-' + pageId);
      if (subNav && subNav.previousElementSibling) {
        subNav.previousElementSibling.classList.add('active-main');
        // ensure it's open
        subNav.classList.add('open');
        subNav.previousElementSibling.classList.add('open');
      }
    }

    // Scroll to hash if provided, else scroll to top
    if (hashId) {
      setTimeout(() => {
        const el = document.getElementById(hashId);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }, 50);
    } else {
      mainContent.scrollTo(0, 0);
    }
    
    // Close sidebar on mobile
    if (window.innerWidth <= 768) {
      closeSidebar();
    }
    
    // Clear search if any
    document.getElementById('searchInput').value = '';
  }

  function applyLanguage() {
    const data = wikiData[currentLang];
    
    // Update texts with data-i18n
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (data[key]) el.innerHTML = data[key];
    });

    // Update placeholders
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (data[key]) el.setAttribute('placeholder', data[key]);
    });

    document.getElementById('lang-toggle').innerText = currentLang.toUpperCase();
    
    // Re-render current page
    let activePage = 'home';
    const activeToggle = document.querySelector('.nav-item-toggle.active-main');
    if (activeToggle && activeToggle.id) {
      if (activeToggle.id.startsWith('btn-')) {
        activePage = activeToggle.id.replace('btn-', '');
      } else {
        const subNav = activeToggle.nextElementSibling;
        if (subNav) {
          activePage = subNav.id.replace('nav-', '');
        }
      }
    }
    showPage(activePage);
  }

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'az' : 'en';
    localStorage.setItem('yes_lang', currentLang);
    applyLanguage();
  }
  
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const isOpen = sidebar.classList.toggle('open');
    if (isOpen) {
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    } else {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  function handleSearch(val) {
    const mainContent = document.getElementById('main-content');
    // First, re-render the clean page to remove old highlights
    let activePage = 'home';
    const activeToggle = document.querySelector('.nav-item-toggle.active-main');
    if (activeToggle && activeToggle.id) {
      if (activeToggle.id.startsWith('btn-')) {
        activePage = activeToggle.id.replace('btn-', '');
      } else {
        const subNav = activeToggle.nextElementSibling;
        if (subNav) activePage = subNav.id.replace('nav-', '');
      }
    }
    
    mainContent.innerHTML = '<div class="content-wrap page active">' + wikiData[currentLang].pages[activePage] + '</div>';
    
    if (!val.trim()) return;
    
    const textNodes = [];
    const walker = document.createTreeWalker(mainContent, NodeFilter.SHOW_TEXT, null, false);
    let node;
    while(node = walker.nextNode()) {
      if (node.parentNode.nodeName !== 'SCRIPT' && node.parentNode.nodeName !== 'STYLE') {
        textNodes.push(node);
      }
    }
    
    const regex = new RegExp('(' + val.replace(/[.*+?^$\/{}()|[\\]\\\\]/g, '\\\\$&') + ')', 'gi');
    textNodes.forEach(node => {
      if (regex.test(node.nodeValue)) {
        const span = document.createElement('span');
        span.innerHTML = node.nodeValue.replace(regex, '<mark>$1</mark>');
        node.parentNode.replaceChild(span, node);
      }
    });
  }

  // Init
  window.addEventListener('load', () => {
    applyLanguage();
  });
</script>
