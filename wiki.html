<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki — Youth Environment Society</title>
  <link rel="alternate" hreflang="az" href="https://youthensoc.org/az/wiki.html" />
  <link rel="alternate" hreflang="en" href="https://youthensoc.org/wiki.html" />
  <link rel="alternate" hreflang="x-default" href="https://youthensoc.org/wiki.html" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  
  <style>
    :root {
      /* YES Brand Colors (matching index.html) */
      --green: #2d6a4f;
      --lime: #74c69d;
      --bright: #b7e4c7;
      --yellow: #f4d35e;
      --pink: #e07a5f;
      --purple: #9b72cf;
      --bg: #f0f4f0;
      --dark: #1a2e1a;
      --dark-green: #1b4332;
      
      /* UI System Colors */
      --border: rgba(45, 106, 79, 0.15);
      --border-light: rgba(45, 106, 79, 0.08);
      --text-main: #2a3f2a;
      --text-muted: #5a7a5a;
      --accent-bg: rgba(116, 198, 157, 0.18);
      --shadow-sm: 0 4px 15px rgba(45, 106, 79, 0.06);
      --shadow-md: 0 8px 30px rgba(45, 106, 79, 0.09);
      --shadow-lg: 0 16px 40px rgba(45, 106, 79, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 80% 10%, rgba(216, 243, 220, 0.7) 0%, transparent 50%),
        radial-gradient(ellipse at 10% 90%, rgba(183, 228, 199, 0.55) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      background: rgba(240, 244, 240, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      height: 68px;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 1.5rem;
      z-index: 100;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--green);
      text-decoration: none;
      width: 250px;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    .logo:hover {
      opacity: 0.9;
    }

    .logo-badge {
      background: var(--green);
      color: white;
      padding: 0.25rem 0.6rem;
      border-radius: 7px;
      font-size: 1rem;
      letter-spacing: 1px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(45, 106, 79, 0.25);
    }

    .logo-wiki {
      color: var(--dark);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Search Bar */
    .search-wrap {
      flex: 1;
      max-width: 440px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--dark);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(45, 106, 79, 0.04);
    }

    .search-wrap input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3.5px rgba(116, 198, 157, 0.28);
    }

    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--green);
      font-size: 1.15rem;
      opacity: 0.8;
      pointer-events: none;
    }

    /* Search Results Dropdown */
    .search-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.14), 0 4px 12px rgba(45, 106, 79, 0.08);
      max-height: 380px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      padding: 6px;
    }

    .search-dropdown.active {
      display: block;
    }

    .search-result-item {
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid rgba(45, 106, 79, 0.06);
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover,
    .search-result-item.selected {
      background: var(--accent-bg);
    }

    .search-result-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-result-page {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--green);
      background: rgba(45, 106, 79, 0.1);
      padding: 2px 7px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .search-result-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--dark);
      font-family: 'Space Grotesk', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-snippet {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .search-result-snippet mark,
    .search-result-title mark {
      background: rgba(116, 198, 157, 0.45);
      color: var(--dark);
      font-weight: 700;
      padding: 0 2px;
      border-radius: 3px;
    }

    .search-empty {
      padding: 22px 14px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* Target highlight on page */
    .highlight-target {
      animation: searchPulse 2.8s ease-out;
      border-radius: 10px;
    }

    @keyframes searchPulse {
      0% {
        background-color: rgba(116, 198, 157, 0.65);
        box-shadow: 0 0 0 6px rgba(116, 198, 157, 0.35);
      }
      60% {
        background-color: rgba(116, 198, 157, 0.25);
        box-shadow: 0 0 0 3px rgba(116, 198, 157, 0.15);
      }
      100% {
        background-color: transparent;
        box-shadow: none;
      }
    }

    .header-right {
      display: flex; gap: 1rem; align-items: center; margin-left: auto;
    }

    /* Language Dropdown (index.html style) */
    .lang-dropdown {
      position: relative;
      display: inline-block;
      z-index: 1000;
    }

    .lang-current {
      background: white;
      color: var(--dark);
      border: 1.5px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .lang-current:hover {
      background: #fdfdfd;
      border-color: var(--lime);
      color: var(--green);
    }

    .lang-current svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      transition: transform 0.2s;
    }

    .lang-dropdown:hover .lang-current svg {
      transform: rotate(180deg);
    }

    .lang-options {
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      border: 1px solid var(--border);
      padding: 0.4rem;
      min-width: 90px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1);
      margin-top: 0.4rem;
    }

    .lang-dropdown:hover .lang-options {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .lang-options button {
      display: block;
      width: 100%;
      padding: 0.5rem 0.8rem;
      border: none;
      background: none;
      color: var(--dark);
      text-align: left;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.15s;
    }

    .lang-options button:hover {
      background: var(--bg);
      color: var(--green);
    }

    .lang-options button.active {
      background: rgba(45, 106, 79, 0.12);
      color: var(--green);
    }

    /* Back to main site link button (solid CTA like index.html .nav-cta) */
    .nav-site-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--green);
      color: white;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(45, 106, 79, 0.22);
    }

    .nav-site-btn:hover {
      background: var(--dark-green);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(45, 106, 79, 0.32);
    }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ── SIDEBAR (dark like index.html pillars section) ── */
    aside {
      width: 270px;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
      padding: 1.4rem 0.85rem;
    }

    .nav-section {
      margin-bottom: 6px;
    }

    .nav-item-toggle {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0.75rem 1rem;
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.93rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      gap: 0.75rem;
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .nav-item-toggle i {
      font-size: 1.2rem;
      color: var(--lime);
      opacity: 0.7;
      transition: all 0.2s ease;
    }

    .nav-item-toggle:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    .nav-item-toggle:hover i { opacity: 1; }

    .nav-item-toggle.active-main {
      background: var(--green);
      color: white;
      box-shadow: 0 4px 15px rgba(45, 106, 79, 0.35);
    }

    .nav-item-toggle.active-main i {
      color: var(--bright);
      opacity: 1;
    }

    .nav-arrow {
      margin-left: auto;
      font-size: 0.8rem;
      transition: transform 0.25s ease;
      color: rgba(255, 255, 255, 0.35);
    }

    .nav-item-toggle.active-main .nav-arrow {
      color: rgba(255, 255, 255, 0.7);
    }

    .nav-item-toggle.open .nav-arrow {
      transform: rotate(90deg);
    }

    .sub-nav {
      display: none;
      flex-direction: column;
      padding-left: 2rem;
      margin-top: 4px;
      margin-bottom: 8px;
      gap: 3px;
    }

    .sub-nav.open { display: flex; }

    .sub-nav a {
      padding: 0.45rem 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
    }

    .sub-nav a:hover {
      color: var(--lime);
      background: rgba(116, 198, 157, 0.1);
    }

    .sub-nav a.active {
      color: var(--lime);
      background: rgba(116, 198, 157, 0.15);
      border-left-color: var(--lime);
      font-weight: 700;
    }

    .sidebar-divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin: 1.2rem 0.5rem;
    }

    .back-link {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.75rem 1rem;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.2s ease;
      margin-top: auto;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--lime);
      border-color: rgba(116, 198, 157, 0.3);
    }

    /* ── MAIN CONTENT ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      scroll-behavior: smooth;
    }

    .content-wrap {
      padding: 3rem 6% 5rem;
      max-width: 980px;
      margin: 0 auto;
    }

    /* Breadcrumb / Section Tag (index.html hero-tag style) */
    .breadcrumb {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: white;
      border: 2px solid var(--lime);
      padding: 0.35rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px rgba(116, 198, 157, 0.15);
    }

    .breadcrumb span { margin: 0 4px; opacity: 0.4; }

    /* Page Title (index.html heading style) */
    .page-title {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(2.3rem, 4.5vw, 3.2rem);
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 2rem;
      line-height: 1.12;
      letter-spacing: -0.5px;
    }

    .page-title em {
      color: var(--green);
      font-style: normal;
    }

    /* Hero Banner for Home */
    .org-hero {
      background: var(--green);
      border-radius: 20px;
      padding: 2.6rem 2.8rem;
      color: white;
      margin-bottom: 2.8rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      box-shadow: 0 16px 45px rgba(27, 67, 50, 0.18);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .org-hero-icon {
      width: 76px; height: 76px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px;
      color: var(--bright);
      flex-shrink: 0;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .org-hero h2 { 
      font-family: 'Manrope', sans-serif;
      font-size: 1.85rem; 
      font-weight: 800;
      margin-bottom: 8px; 
      letter-spacing: -0.3px;
    }
    
    .org-hero p { 
      opacity: 0.92; 
      font-size: 1.05rem; 
      line-height: 1.65; 
    }

    /* Cards Grid (matching index.html volunteer/pillar cards) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0;
    }

    /* Nav Cards — dark pillar style matching index.html */
    .nav-card {
      background: var(--dark);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 2rem 1.8rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      text-decoration: none;
      color: white;
      display: block;
      box-shadow: 0 8px 25px rgba(26, 46, 26, 0.15);
      position: relative;
      overflow: hidden;
    }

    .nav-card::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 100px; height: 100px;
      background: radial-gradient(circle, rgba(116, 198, 157, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .nav-card:nth-child(1) .nav-card-icon { color: var(--lime); background: rgba(116, 198, 157, 0.12); }
    .nav-card:nth-child(2) .nav-card-icon { color: #c5a3f0; background: rgba(155, 114, 207, 0.12); }
    .nav-card:nth-child(3) .nav-card-icon { color: #f0a090; background: rgba(224, 122, 95, 0.12); }
    .nav-card:nth-child(4) .nav-card-icon { color: var(--yellow); background: rgba(244, 211, 94, 0.12); }

    .nav-card:hover {
      transform: translateY(-6px);
      background: rgba(45, 106, 79, 0.18);
      border-color: rgba(116, 198, 157, 0.2);
      box-shadow: 0 20px 50px rgba(26, 46, 26, 0.22);
    }

    .nav-card-icon { 
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px; 
      margin-bottom: 1.2rem;
      transition: transform 0.3s ease;
    }

    .nav-card:hover .nav-card-icon { transform: scale(1.08); }

    .nav-card h3 { 
      font-family: 'Manrope', sans-serif;
      font-size: 1.15rem; 
      font-weight: 700; 
      margin-bottom: 0.5rem;
      color: white;
    }

    .nav-card p { 
      font-size: 0.9rem; 
      color: rgba(255, 255, 255, 0.55); 
      line-height: 1.6; 
    }

    /* Content Typography */
    .section-title {
      font-family: 'Manrope', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--dark);
      margin: 2.8rem 0 1.2rem;
      display: flex; 
      align-items: center; 
      gap: 0.75rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.8rem;
      letter-spacing: -0.3px;
    }

    .section-title i {
      color: var(--green);
      font-size: 1.5rem;
    }

    .body-text {
      font-size: 1.06rem;
      line-height: 1.8;
      color: #3d5a3d;
      margin-bottom: 1.2rem;
    }

    /* Modern List Items (Cards style) */
    .wiki-list {
      margin: 0 0 2rem 0;
      padding-left: 0;
      list-style: none;
    }

    .wiki-list li {
      font-size: 1.02rem;
      color: var(--dark);
      line-height: 1.7;
      margin-bottom: 0.8rem;
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      background: white;
      padding: 1.1rem 1.4rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .wiki-list li:hover {
      transform: translateX(3px);
      box-shadow: var(--shadow-sm);
    }
    
    .wiki-list li::before {
      content: '✓';
      color: var(--green);
      font-weight: 800;
      font-size: 0.95rem;
      background: rgba(116, 198, 157, 0.22);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .wiki-list li a { 
      color: var(--green); 
      text-decoration: underline; 
      text-underline-offset: 3px;
      font-weight: 700;
    }
    .wiki-list li a:hover { color: #1b4332; }

    /* Callouts (matches index.html .join green gradient style) */
    .callout {
      background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
      border-radius: 16px;
      border: none;
      padding: 1.5rem 1.8rem;
      margin: 1.8rem 0;
      font-size: 1.02rem;
      color: #1a3a1a;
      line-height: 1.7;
      box-shadow: 0 4px 20px rgba(45, 106, 79, 0.08);
      position: relative;
      overflow: hidden;
    }

    .callout::before {
      content: 'YES';
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 5rem;
      color: rgba(45, 106, 79, 0.05);
      pointer-events: none;
    }

    .callout strong { font-weight: 800; color: var(--dark-green); }

    /* Tags / Status Badges */
    .tag {
      display: inline-block;
      background: white;
      border: 1.5px solid var(--border);
      color: var(--green);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-right: 10px;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.4px;
    }
    .tag.done { background: rgba(116, 198, 157, 0.2); border-color: var(--lime); color: var(--green); }
    .tag.ongoing { background: rgba(244, 211, 94, 0.22); border-color: var(--yellow); color: #9c7f1a; }
    .tag.planned { background: rgba(224, 122, 95, 0.15); border-color: var(--pink); color: var(--pink); }

      cursor: default;

      pointer-events: none;

  };

  let currentLang = localStorage.getItem('yes_lang') || 'az';

  function toggleSub(btn, id) {
    const sub = document.getElementById(id);
    const isOpen = sub.classList.contains('open');
    
    // Close others
    document.querySelectorAll('.sub-nav').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.nav-item-toggle').forEach(el => el.classList.remove('open'));
    
    if (!isOpen) {
      sub.classList.add('open');
      btn.classList.add('open');
    }
  }

  function showPage(pageId, hashId = null) {
    // Render content
    const mainContent = document.getElementById('main-content');
    const data = wikiData[currentLang] || wikiData.en;
    mainContent.innerHTML = '<div class="content-wrap page active">' + data.pages[pageId] + '</div>';

    // Update active nav main buttons
    document.querySelectorAll('.nav-item-toggle').forEach(btn => btn.classList.remove('active-main'));
    if (pageId === 'home' || pageId === 'contact' || pageId === 'team') {
      const btn = document.getElementById('btn-' + pageId);
      if(btn) btn.classList.add('active-main');
    } else {
      // Find the parent nav toggle and set active
      const subNav = document.getElementById('nav-' + pageId);
      if (subNav && subNav.previousElementSibling) {
        subNav.previousElementSibling.classList.add('active-main');
        // ensure it's open
        subNav.classList.add('open');
        subNav.previousElementSibling.classList.add('open');
      }
    }

    // Scroll to hash if provided, else scroll to top
    if (hashId) {
      setTimeout(() => {
        const el = document.getElementById(hashId);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }, 50);
    } else {
      mainContent.scrollTo(0, 0);
    }
    
    // Close sidebar on mobile
    if (window.innerWidth <= 768) {
      closeSidebar();
    }
    
    // Clear search if any
    const searchEl = document.getElementById('searchInput');
    if (searchEl) searchEl.value = '';
    const dropdown = document.getElementById('searchResults');
    if (dropdown) dropdown.classList.remove('active');
  }

  function setWikiLang(lang) {
    currentLang = lang;
    localStorage.setItem('yes_lang', currentLang);
    applyLanguage();
  }

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'az' : 'en';
    localStorage.setItem('yes_lang', currentLang);
    applyLanguage();
  }

  function applyLanguage() {
    const data = wikiData[currentLang] || wikiData.en;
    document.documentElement.lang = currentLang;
    
    // Update texts with data-i18n
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (data[key]) el.innerHTML = data[key];
    });

    // Update placeholders
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (data[key]) el.setAttribute('placeholder', data[key]);
    });

    // Update language badge / options
    const activeLangEl = document.getElementById('active-lang');
    if (activeLangEl) activeLangEl.innerText = currentLang.toUpperCase();

    document.querySelectorAll('.lang-options button').forEach(btn => btn.classList.remove('active'));
    const optBtn = document.getElementById('opt-' + currentLang);
    if (optBtn) optBtn.classList.add('active');
    
    // Re-render current page
    let activePage = 'home';
    const activeToggle = document.querySelector('.nav-item-toggle.active-main');
    if (activeToggle && activeToggle.id) {
      if (activeToggle.id.startsWith('btn-')) {
        activePage = activeToggle.id.replace('btn-', '');
      } else {
        const subNav = activeToggle.nextElementSibling;
        if (subNav) {
          activePage = subNav.id.replace('nav-', '');
        }
      }
    }
    showPage(activePage);
  }
  
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const isOpen = sidebar.classList.toggle('open');
    if (isOpen) {
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    } else {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  const PAGE_NAMES = {
    en: {
      home: "Home",
      about: "About Us",
      team: "Team",
      projects: "Our Work",
      docs: "Documents",
      contact: "Contact & Support"
    },
    az: {
      home: "Ana Səhifə",
      about: "Haqqımızda",
      team: "Komanda",
      projects: "Fəaliyyətimiz",
      docs: "Sənədlər",
      contact: "Əlaqə & Dəstək"
    }
  };

  let selectedSearchIndex = -1;

  function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlightMatches(text, query) {
    if (!text || !query) return text;
    const regex = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function searchAllPages(rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    if (!q || q.length < 2) return [];

    const lang = currentLang || 'az';
    const langData = wikiData[lang] || wikiData.az || wikiData.en;
    const pageNames = (PAGE_NAMES[lang] || PAGE_NAMES.az);
    const results = [];
    const pageOrder = ['home', 'about', 'team', 'projects', 'docs', 'contact'];

    pageOrder.forEach(pageKey => {
      const pageHtml = langData.pages[pageKey];
      if (!pageHtml) return;

      const container = document.createElement('div');
      container.innerHTML = pageHtml;
      const pageTitle = pageNames[pageKey] || pageKey;

      // 1. Team cards
      container.querySelectorAll('.member-card').forEach(card => {
        const name = card.querySelector('.member-name')?.textContent?.trim() || '';
        const role = card.querySelector('.member-role')?.textContent?.trim() || '';
        if ((name + ' ' + role).toLowerCase().includes(q)) {
          results.push({
            pageKey,
            pageTitle,
            title: name,
            snippet: role,
            targetId: 'members',
            targetText: name
          });
        }
      });

      // 2. Headings (h1, h2, h3)
      container.querySelectorAll('h1, h2, h3').forEach(h => {
        const text = h.textContent.trim();
        if (text.toLowerCase().includes(q)) {
          let next = h.nextElementSibling;
          let snippet = '';
          while (next && !snippet) {
            if (next.tagName === 'P' || next.tagName === 'UL') {
              snippet = next.textContent.trim().replace(/\s+/g, ' ').slice(0, 110);
            }
            next = next.nextElementSibling;
          }
          results.push({
            pageKey,
            pageTitle,
            title: text,
            snippet: snippet,
            targetId: h.id || null,
            targetText: text
          });
        }
      });

      // 3. Nav cards (on Home page)
      container.querySelectorAll('.nav-card').forEach(card => {
        const cardTitle = card.querySelector('h3')?.textContent?.trim() || '';
        const cardDesc = card.querySelector('p')?.textContent?.trim() || '';
        if ((cardTitle + ' ' + cardDesc).toLowerCase().includes(q)) {
          const isDupe = results.some(r => r.pageKey === pageKey && r.title === cardTitle);
          if (!isDupe) {
            results.push({
              pageKey,
              pageTitle,
              title: cardTitle,
              snippet: cardDesc,
              targetId: null,
              targetText: cardTitle
            });
          }
        }
      });

      // 4. Paragraphs, List Items, Callouts
      container.querySelectorAll('p, li, .callout').forEach(el => {
        if (el.closest('.member-card') || el.closest('.nav-card')) return;
        const text = el.textContent.trim().replace(/\s+/g, ' ');
        if (!text) return;

        const lower = text.toLowerCase();
        if (lower.includes(q)) {
          let prev = el.previousElementSibling;
          let sectionHeading = '';
          let sectionId = null;
          while (prev) {
            if (/^H[1-3]$/i.test(prev.tagName) || prev.classList.contains('section-title')) {
              sectionHeading = prev.textContent.trim();
              sectionId = prev.id || null;
              break;
            }
            prev = prev.previousElementSibling;
          }

          const title = sectionHeading || pageTitle;
          const idx = lower.indexOf(q);
          const start = Math.max(0, idx - 35);
          const end = Math.min(text.length, idx + q.length + 55);
          const snippet = (start > 0 ? '...' : '') + text.slice(start, end) + (end < text.length ? '...' : '');

          const isDupe = results.some(r => r.pageKey === pageKey && (r.snippet === snippet || r.title === title && Math.abs(r.snippet.length - snippet.length) < 15));
          if (!isDupe) {
            results.push({
              pageKey,
              pageTitle,
              title: title,
              snippet: snippet,
              targetId: sectionId,
              targetText: text.slice(idx, idx + q.length + 15)
            });
          }
        }
      });
    });

    return results.slice(0, 10);
  }

  function handleSearch(val) {
    const dropdown = document.getElementById('searchResults');
    if (!dropdown) return;

    const trimmed = (val || '').trim();
    if (trimmed.length < 2) {
      dropdown.classList.remove('active');
      dropdown.innerHTML = '';
      selectedSearchIndex = -1;
      return;
    }

    const results = searchAllPages(trimmed);
    selectedSearchIndex = -1;

    if (results.length === 0) {
      const emptyMsg = currentLang === 'en' ? 'No results found' : 'Nəticə tapılmadı';
      dropdown.innerHTML = `
        <div class="search-empty">
          <i class="ph ph-magnifying-glass" style="font-size: 20px; display: block; margin-bottom: 6px; opacity: 0.5;"></i>
          <span>${emptyMsg}</span>
        </div>
      `;
      dropdown.classList.add('active');
      return;
    }

    let html = '';
    results.forEach((res, index) => {
      const highlightedTitle = highlightMatches(res.title, trimmed);
      const highlightedSnippet = highlightMatches(res.snippet, trimmed);

      const safePage = res.pageKey.replace(/'/g, "\\'");
      const safeId = res.targetId ? res.targetId.replace(/'/g, "\\'") : '';
      const safeText = res.targetText ? res.targetText.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';

      html += `
        <div class="search-result-item" data-index="${index}" onclick="selectSearchResult('${safePage}', '${safeId}', '${safeText}')">
          <div class="search-result-header">
            <span class="search-result-page">${res.pageTitle}</span>
            <span class="search-result-title">${highlightedTitle}</span>
          </div>
          ${res.snippet ? `<div class="search-result-snippet">${highlightedSnippet}</div>` : ''}
        </div>
      `;
    });

    dropdown.innerHTML = html;
    dropdown.classList.add('active');
  }

  function selectSearchResult(pageKey, targetId, targetText) {
    showPage(pageKey, targetId);

    const dropdown = document.getElementById('searchResults');
    if (dropdown) dropdown.classList.remove('active');

    setTimeout(() => {
      const mainContent = document.getElementById('main-content');
      if (!mainContent) return;

      let el = null;
      if (targetId) {
        el = document.getElementById(targetId);
      }

      if (!el && targetText) {
        const walker = document.createTreeWalker(mainContent, NodeFilter.SHOW_TEXT, null, false);
        let node;
        const needle = targetText.trim().toLowerCase();
        while ((node = walker.nextNode())) {
          if (node.nodeValue.toLowerCase().includes(needle)) {
            el = node.parentElement;
            break;
          }
        }
      }

      if (el) {
        const card = el.closest('.member-card, .nav-card, .callout, li, h1, h2, h3');
        const targetToHighlight = card || el;

        targetToHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
        targetToHighlight.classList.remove('highlight-target');
        void targetToHighlight.offsetWidth;
        targetToHighlight.classList.add('highlight-target');
        setTimeout(() => targetToHighlight.classList.remove('highlight-target'), 3000);
      }
    }, 150);
  }

  // Keyboard navigation & outside click handlers
  window.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('searchInput');
    const dropdown = document.getElementById('searchResults');

    if (searchInput) {
      searchInput.addEventListener('keydown', (e) => {
        if (!dropdown || !dropdown.classList.contains('active')) return;
        const items = dropdown.querySelectorAll('.search-result-item');
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectedSearchIndex = (selectedSearchIndex + 1) % items.length;
          items.forEach((item, idx) => item.classList.toggle('selected', idx === selectedSearchIndex));
          items[selectedSearchIndex]?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectedSearchIndex = (selectedSearchIndex - 1 + items.length) % items.length;
          items.forEach((item, idx) => item.classList.toggle('selected', idx === selectedSearchIndex));
          items[selectedSearchIndex]?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (selectedSearchIndex >= 0 && items[selectedSearchIndex]) {
            items[selectedSearchIndex].click();
          } else if (items[0]) {
            items[0].click();
          }
        } else if (e.key === 'Escape') {
          dropdown.classList.remove('active');
        }
      });

      searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim().length >= 2) {
          handleSearch(searchInput.value);
        }
      });
    }

    document.addEventListener('click', (e) => {
      const searchWrap = document.querySelector('.search-wrap');
      if (searchWrap && !searchWrap.contains(e.target)) {
        if (dropdown) dropdown.classList.remove('active');
      }
    });
  });

  // Init
  window.addEventListener('load', () => {
    applyLanguage();
  });
</script>
